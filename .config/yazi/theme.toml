[manager]
cwd = { fg = "#a9b665" }

# File list
file = { fg = "#d4be98" }
hovered = { bg = "#32302f", fg = "#ddc7a1" }
preview_hovered = { bg = "#32302f", fg = "#ddc7a1" }

# Selection & markers
marker_copied = { fg = "#89b482", bg = "#32302f" }
marker_cut = { fg = "#ea6962", bg = "#32302f" }
marker_selected = { fg = "#d8a657", bg = "#32302f" }

# Borders & UI
border_symbol = "│"
border_style = { fg = "#45403d" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#45403d", bg = "#282828" }

mode_normal = { bg = "#a9b665", fg = "#282828", bold = true }
mode_select = { bg = "#d8a657", fg = "#282828", bold = true }
mode_unset  = { bg = "#ea6962", fg = "#282828", bold = true }

[status.left]
cwd = { fg = "#d4be98", bold = true }

[status.right]
permissions = { fg = "#7c6f64" }
size        = { fg = "#7daea3" }
mtime       = { fg = "#89b482" }

[tab]
active   = { bg = "#32302f", fg = "#ddc7a1", bold = true }
inactive = { bg = "#282828", fg = "#7c6f64" }

[input]
border = { fg = "#45403d" }
title  = { fg = "#d8a657", bold = true }
value  = { fg = "#d4be98" }
selected = { bg = "#32302f" }

[confirm]
border = { fg = "#ea6962" }
title  = { fg = "#ea6962", bold = true }
content = { fg = "#d4be98" }

[completion]
border = { fg = "#45403d" }
active = { bg = "#32302f" }
inactive = { fg = "#7c6f64" }

[help]
key = { fg = "#e78a4e" }
desc = { fg = "#d4be98" }
group = { fg = "#d8a657", bold = true }

[notify]
title_info  = { fg = "#7daea3" }
title_warn  = { fg = "#d8a657" }
title_error = { fg = "#ea6962" }

